name: Build chiaki-ng macOSX

on:
  workflow_dispatch:

jobs:
  build-mac_x64:
    name: Build macOSX x86_64 version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: x86_64
          MACOS_DMG: chiaki-ng.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_x86_64-Release
          path: |
            chiaki-ng.dmg
            chiaki-ng.json
          if-no-files-found: error
          retention-days: 7

  build-mac_arm64:
    name: Build macOSX arm64 version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: arm64
          MACOS_DMG: chiaki-ng.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_arm64-Release
          path: |
            chiaki-ng.dmg
            chiaki-ng.json
          if-no-files-found: error
          retention-days: 7
