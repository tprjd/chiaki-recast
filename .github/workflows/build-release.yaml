name: Create chiaki-ng release

on:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  create-release:
    name: Upload release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: generate release notes
      working-directory: ${{ github.workspace }}
      run: |
        git tag -l --format='%(contents)' ${GITHUB_REF_NAME} >> doc/release_notes.md

    - uses: ncipollo/release-action@v1
      id: maker
      with:
        prerelease: false
        allowUpdates: true
        bodyFile: "${{ github.workspace }}/doc/release_notes.md"
        token: "${{ secrets.RELEASE_PAT }}"
    outputs:
      upload_url: ${{ steps.maker.outputs.upload_url }}

  build-windows_x64-msvc:
    name: Build Windows x64 with Qt WebEngine
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows-x86.yml
    with:
      release-upload-url: ${{ needs.create-release.outputs.upload_url }}
      test-build: false

  windows-arm64-support:
    name: Windows ARM64 package is unavailable with Qt 6.9.3
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Windows ARM64 is not published. The selected Qt 6.9.3 WebEngine SDK supports Windows MSVC x64 only. There is no QML setup fallback.' >> "$GITHUB_STEP_SUMMARY"

  build-mac_arm64_github:
    name: Build macOSX arm64 version Github
    runs-on: macos-14
    permissions:
      contents: write
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: arm64
          MACOS_DMG: chiaki-ng-macos_arm64-Release.dmg
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

      - name: Upload chiaki-ng Artifact
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            chiaki-ng-macos_arm64-Release.dmg
            chiaki-ng-macos_arm64-Release.json
          if-no-files-found: error
          upload-release-files: true
          release-upload-url: ${{ needs.create-release.outputs.upload_url }}

  build-mac_x64:
    name: Build macOSX x86_64 version
    permissions:
      contents: write
    needs: create-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: x86_64
          MACOS_DMG: chiaki-ng-macos_amd64-Release.dmg
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

      - name: Upload chiaki-ng Artifact
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            chiaki-ng-macos_amd64-Release.dmg
            chiaki-ng-macos_amd64-Release.json
          upload-release-files: true
          if-no-files-found: error
          release-upload-url: ${{ needs.create-release.outputs.upload_url }}

  build-appimage_x64:
    name: Build chiaki-ng appimage_x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: create-release
    
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ng'

      - name: Run build script
        working-directory: chiaki-ng
        run: |
          set -xe
          podman build -t chiaki-appimage -f scripts/Dockerfile.qt6 scripts
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t chiaki-appimage \
            /bin/bash -c 'sudo -E env PATH="$PATH" scripts/build-appimage.sh /build/appdir'
          cp appimage/chiaki-ng.AppImage appimage/chiaki-ng.AppImage_x86_64

      - name: Upload chiaki-ng Artifact
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            chiaki-ng/appimage/chiaki-ng.AppImage_x86_64
          upload-release-files: true
          if-no-files-found: error
          release-upload-url: ${{ needs.create-release.outputs.upload_url }}
