name: Build chiaki-ng Windows arm64 portable (VC)

on:
  workflow_dispatch:

jobs:
  unsupported-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Report unsupported Windows toolchain
        run: |
          echo '::error::Qt 6.9.3 WebEngine requires Windows MSVC x64. MinGW and Windows ARM64 packages are unavailable. Use Build chiaki-ng Windows x86_64 (VC). There is no QML setup fallback.'
          exit 1
