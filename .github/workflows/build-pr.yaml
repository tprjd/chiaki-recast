name: Build chiaki-ng pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-windows_x64-msvc:
    name: Build Windows x64 with Qt WebEngine
    uses: ./.github/workflows/build-windows-x86.yml

  windows-arm64-support:
    name: Windows ARM64 package is unavailable with Qt 6.9.3
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Windows ARM64 is not published. The selected Qt 6.9.3 WebEngine SDK supports Windows MSVC x64 only. There is no QML setup fallback.' >> "$GITHUB_STEP_SUMMARY"

  build-mac_arm64_github:
    name: Build macOSX arm64 version Github
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: arm64
          MACOS_DMG: chiaki-ng-macos_arm64-Release.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_arm64-Release.dmg
          path: |
            chiaki-ng-macos_arm64-Release.dmg
            chiaki-ng-macos_arm64-Release.json
          if-no-files-found: error
          retention-days: 7

  build-mac_x64:
    name: Build macOSX x86_64 version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        env:
          MACOS_ARCH: x86_64
          MACOS_DMG: chiaki-ng.dmg

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-macos_x86_64-Release
          path: |
            chiaki-ng.dmg
            chiaki-ng.json
          if-no-files-found: error
          retention-days: 7

  build-appimage_x64:
    name: Build chiaki-ng appimage_x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ng'

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ng
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Run build script
        working-directory: chiaki-ng
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.9 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          cp appimage/chiaki-ng.AppImage appimage/chiaki-ng.AppImage_x86_64

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng.AppImage_x86_64
          path: chiaki-ng/appimage/chiaki-ng.AppImage_x86_64
          if-no-files-found: error
          retention-days: 7

  build-appimage_arm64:
    name: Build chiaki-ng appimage_arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Setup Podman
        run: |
          sudo apt update
          sudo apt-get -y install podman

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          path: 'chiaki-ng'

      - name: Add QmlWebEngine Import
        working-directory: chiaki-ng
        run: |
          cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Run build script
        working-directory: chiaki-ng
        run: |
          set -xe
          podman run --rm \
            -v "`pwd`:/build/chiaki" \
            -w "/build/chiaki" \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            -t docker.io/streetpea/chiaki-ng-builder:qt6.7 \
            /bin/bash -c "sudo -E scripts/build-appimage.sh /build/appdir"
          cp appimage/chiaki-ng.AppImage appimage/chiaki-ng.AppImage_arm64

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng.AppImage_arm64
          path: chiaki-ng/appimage/chiaki-ng.AppImage_arm64
          if-no-files-found: error
          retention-days: 7
